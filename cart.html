<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shopping Cart</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="shop.css">

</head>

<body>

<header>

<h2 style="padding:20px;">🛒 Shopping Cart</h2>

</header>

<section class="cart-page">

<table>

<thead>

<tr>
<th>Image</th>
<th>Product</th>
<th>Price</th>
<th>Quantity</th>
<th>Total</th>
<th>Remove</th>
</tr>

</thead>

<tbody id="cartItems">

</tbody>

</table>

<div class="cart-summary">

<h2>Total: $<span id="grandTotal">0.00</span></h2>

<a href="checkout.html" class="shop">Proceed To Checkout</a>

</div>

</section>

<script src="script.js"></script>

</body>

</html>
